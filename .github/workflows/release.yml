name: Release

# 推送 v* 标签时：构建油猴脚本 + MV3 扩展，并附到 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:all

      - name: Package extension zip
        run: |
          cd dist/extension
          zip -qr ../chat-export-extension.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/chat-export.user.js
            dist/chat-export-extension.zip
